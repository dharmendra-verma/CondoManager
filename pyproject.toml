# pyproject.toml — first Python project in the CondoManager repo.
# Jira: CM-21  | Epic: Observability (CM-21..CM-27)  | Phase 0
#
# Standard PEP 621 metadata with setuptools as the build backend (zero new
# tool dependencies — no Poetry / uv / hatch). Python is pinned to 3.12 to
# match the curated base image from CM-20 (python:3.12-slim).
#
# Install for development:
#   python -m venv .venv
#   source .venv/bin/activate            # PowerShell: .\.venv\Scripts\Activate.ps1
#   pip install -e ".[dev]"
#
# Lockfile (requirements-lock.txt) is committed so CI builds are reproducible.
# Regenerate after a dependency bump:
#   pip install -e ".[dev]" --upgrade
#   pip freeze --exclude-editable > requirements-lock.txt

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "condomanager-agents"
version = "0.1.0"
description = "CondoManager agent runtime — observability, LangGraph orchestrator, channel adapters."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "CondoManager Platform Team", email = "platform@condomanager.local" }]
keywords = ["langgraph", "opentelemetry", "azure", "condomanager"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  # Pydantic — settled choice per CLAUDE.md tech stack.
  "pydantic>=2.7,<3",
  # FastAPI + httpx + openai are the auto-instrumentation targets for AC #2.
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  # OpenTelemetry SDK + OTLP-HTTP exporter (CM-22 will set the endpoint env var).
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  # OTel auto-instrumentations (FastAPI + httpx).
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1",
  # OpenInference for OpenAI — richer LLM-specific span attributes than Traceloop's
  # built-in openai instrumentor; we use this and disable Traceloop's openai to
  # avoid double-emitted spans. See agents/observability/instrumentation.py.
  "openinference-instrumentation-openai>=0.1,<1",
  # Traceloop SDK — for LangChain / LangGraph high-level chain tracing.
  "traceloop-sdk>=0.30,<1",
  # CM-22: Microsoft's Azure Monitor OTel distro. configure_otel() delegates
  # here when APPLICATIONINSIGHTS_CONNECTION_STRING is set — gets Live Metrics
  # + sampler wiring in one supported call. The `configure_azure_monitor`
  # `enable_live_metrics` and `sampler` kwargs are stable in 1.6+.
  "azure-monitor-opentelemetry>=1.6,<2",
  # CM-23: LangChain ecosystem. `langchain` is the runtime; `langchain-openai`
  # ships the ChatOpenAI integration used by the demo + future agents; the
  # `langsmith` SDK provides the Client for dataset CRUD. `<1` caps the 0.x
  # train; a 1.0 bump will need its own story.
  "langchain>=0.3,<1",
  "langchain-openai>=0.2,<1",
  "langsmith>=0.1,<1",
  # CM-24: Langfuse SDK for production LLM observability. @observe decorator
  # is the primary surface; keys are read from env (sourced from KV in prod
  # via the CM-26 secretRef wiring). Coexists with App Insights — different
  # backend purpose (LLM cost/quality vs engineering observability).
  "langfuse>=2.40,<3",
  # CM-28: LangGraph spine. `langgraph` is the StateGraph runtime; the
  # `langgraph-checkpoint` package ships BaseCheckpointSaver + MemorySaver
  # (production checkpointers like the Cosmos one in agents/orchestrator/
  # extend BaseCheckpointSaver from this package). Pinned <1 — the 0.x
  # train is stable through CM-32; a 1.0 bump needs its own story.
  "langgraph>=0.2,<1",
  "langgraph-checkpoint>=2,<3",
  # CM-28: Azure Cosmos SDK. Used by CosmosCheckpointSaver to persist
  # LangGraph checkpoints to the new `checkpoints` container (CM-17 db).
  # DefaultAzureCredential routes through the CM-18 User-Assigned MI in
  # prod; local dev uses az login.
  "azure-cosmos>=4.7,<5",
  # CM-34: LangChain's text splitter for the Drive→Cosmos chunking pipeline
  # (agents/knowledge/chunking.py, reused by CM-33). Already pulled in
  # transitively by `langchain`; declared explicitly so the import is stable.
  "langchain-text-splitters>=0.3,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",       # httpx + openai HTTP mocking for tests
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]
# CM-34: Google Drive client deps for agents/knowledge/gdrive_client.py. These
# are an OPTIONAL, deploy-time extra (only the gdrive-sync Function App needs
# them — see functions/gdrive-sync/requirements.txt). gdrive_client lazy-imports
# them, so they stay out of the base runtime + the test env (the orchestrator
# is tested through an in-memory fake Drive). Kept out of requirements-lock.txt
# for the same reason.
gdrive = [
  "google-api-python-client>=2.100,<3",
  "google-auth>=2.35,<3",
]
# CM-38: Azure AI Language client for the rich PII detector
# (agents/security/detection.py::AzureLanguagePiiDetector). OPTIONAL, deploy-time
# only — the detector is lazy-imported and only reached when AI_LANGUAGE_ENDPOINT
# is set. CI + local tests run the offline RegexPiiDetector, so this stays out of
# the base runtime and requirements-lock.txt (same pattern as the gdrive extra).
security = [
  "azure-ai-textanalytics>=5.3,<6",
]

[tool.setuptools.packages.find]
include = ["agents*"]
exclude = ["tests*"]

# -----------------------------------------------------------------------------
# Tooling configuration — kept here so there's a single source of truth.
# -----------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
# Scope ruff to the new Python package + its tests. `infra/scripts/*.py`
# (the Cosmos + Key Vault smoke-tests from CM-17 / CM-18) pre-date this
# config and use their own conventions — leaving them alone for now.
src = ["agents", "tests"]
extend-exclude = [".venv", "build", "dist", "infra"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes; I = isort; B = bugbear; UP = pyupgrade;
# ASYNC = async-correctness lints (we have lots of async code coming).
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# Demo script is intentionally allowed to use print + bare logging.
[tool.ruff.lint.per-file-ignores]
"agents/observability/demo.py" = ["T201"]
"tests/**/*.py" = ["B018"]   # tests sometimes evaluate expressions for side effects

[tool.mypy]
python_version = "3.12"
strict = true
files = ["agents"]
# Third-party libs without type stubs — silence the noise.
# CM-34 adds the google-* Drive libs (optional `gdrive` extra, not installed in
# CI) + langchain-text-splitters (no py.typed marker), so mypy treats them as
# Any rather than erroring on a missing module / marker.
[[tool.mypy.overrides]]
module = [
  "traceloop.*",
  "openinference.*",
  "respx.*",
  "uvicorn",
  "langfuse.*",
  "google.*",
  "googleapiclient.*",
  "langchain_text_splitters.*",
  # CM-38: optional `security` extra, not installed in CI (lazy-imported).
  "azure.ai.textanalytics",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Quieter output by default; CI passes -q anyway.
addopts = "-ra"
filterwarnings = [
  # Traceloop and openinference emit DeprecationWarnings from upstream deps that
  # we can't fix; demoting to ignore keeps the suite focused on our own warnings.
  "ignore::DeprecationWarning:traceloop.*",
  "ignore::DeprecationWarning:openinference.*",
]
