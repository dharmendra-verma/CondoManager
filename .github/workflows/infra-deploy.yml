# Infra deploy pipeline — CM-15 (single-RG topology)
# Triggers:
#   * Pull request that touches infra/ → bicep build + what-if (no apply)
#   * Push to main that touches infra/ → bicep build + deploy the RG (one-shot)
#
# About the dev/prod "stages":
#   The RG itself is shared. The dev/prod gates kick in for downstream stories
#   that add per-env resources (e.g. cosmos-condomanager-dev / -prod). Those
#   resource-level workflows reuse the same AZURE_* secrets and the
#   `dev` and `prod` GitHub Environments configured for this repo.
#
# Required GitHub secrets (OIDC federated credentials):
#   AZURE_CLIENT_ID         — App registration (federated, OIDC)
#   AZURE_TENANT_ID         — Azure AD tenant
#   AZURE_SUBSCRIPTION_ID   — Target subscription
#
# Required GitHub environments (Settings → Environments):
#   dev   — no approvers (placeholder for per-env resource jobs)
#   prod  — manual approval + protected branch rule
name: infra-deploy

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write      # OIDC federated login to Azure
  contents: read
  pull-requests: write # what-if comment on PR

jobs:
  lint:
    name: Bicep lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -sSL https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64 -o bicep
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Run lint test
        run: bash tests/infra/test_bicep_lint.sh

      - name: Bicep build (compile to ARM)
        run: bicep build infra/bicep/main.bicep --outfile /tmp/main.json

      - name: Upload compiled ARM template
        uses: actions/upload-artifact@v4
        with:
          name: arm-template
          path: /tmp/main.json
          retention-days: 14

  what-if:
    name: What-if (shared RG)
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment sub what-if
        run: |
          az deployment sub what-if \
            --location eastus2 \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/main.parameters.json

  deploy-rg:
    name: Deploy → rg-condomanager
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod    # gates the shared RG behind manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: az deployment sub create (shared RG)
        run: |
          az deployment sub create \
            --name cm15-rg-${{ github.run_number }} \
            --location eastus2 \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/main.parameters.json
