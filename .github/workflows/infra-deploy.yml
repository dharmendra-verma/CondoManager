# Infra deploy pipeline — CM-15 (single-RG topology, RG-scoped SP), CM-17 (Cosmos)
# Triggers:
#   * Pull request that touches infra/ → bicep build + what-if (no apply)
#   * Push to main that touches infra/ → bicep build + deploy into the RG
#
# The shared RG (rg-condomanager) is bootstrapped out-of-band so the CI
# service principal can be scoped to Contributor on that single RG instead
# of the whole subscription. Deployments target the RG via `az deployment
# group …`. See infra/scripts/setup-azure-oidc.sh for the bootstrap.
#
# Required GitHub secrets (OIDC federated credentials):
#   AZURE_CLIENT_ID         — App registration (federated, OIDC)
#   AZURE_TENANT_ID         — Azure AD tenant
#   AZURE_SUBSCRIPTION_ID   — Target subscription
#
# Required GitHub environments (Settings → Environments):
#   dev   — no approvers (placeholder for per-env resource jobs)
#   prod  — manual approval (gates the shared RG deploy)
name: infra-deploy

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write      # OIDC federated login to Azure
  contents: read
  pull-requests: write # what-if comment on PR

jobs:
  lint:
    name: Bicep lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -sSL https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64 -o bicep
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Run lint test
        run: bash tests/infra/test_bicep_lint.sh

      - name: Bicep build (compile to ARM)
        run: bicep build infra/bicep/main.bicep --outfile /tmp/main.json

      - name: Upload compiled ARM template
        uses: actions/upload-artifact@v4
        with:
          name: arm-template
          path: /tmp/main.json
          retention-days: 14

  what-if:
    name: What-if (shared RG)
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment group what-if
        # `env` is also defaulted in main.parameters.json; the CLI override
        # keeps the deploy target visible at the workflow level and matches
        # what deploy-rg uses below.
        run: |
          az deployment group what-if \
            --resource-group rg-condomanager \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/main.parameters.json \
            --parameters env=dev

  deploy-rg:
    name: Deploy → rg-condomanager
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod    # gates the shared RG behind manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: az deployment group create (into rg-condomanager)
        run: |
          az deployment group create \
            --resource-group rg-condomanager \
            --name cm-rg-${{ github.run_number }} \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/main.parameters.json \
            --parameters env=dev
