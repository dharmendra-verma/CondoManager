# Build pipeline — CM-19 (CI split) + CM-21 (python area)
#
# Triggers on every pull request and on push to main. Runs per-area
# build/lint/test jobs and posts a sticky summary comment back to the PR.
#
# Areas today:
#   * infra  — Bicep lint + what-if (CM-19)
#   * python — agents package: ruff + mypy + pytest (CM-21)
#
# Future areas (portal, etc.) add their own jobs alongside these.
#
# OIDC is used for the what-if Azure login (existing federated credentials
# from CM-15 — subject `repo:.../...:pull_request`). No PATs anywhere; the
# summary comment uses the built-in GITHUB_TOKEN.
name: build

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write       # OIDC for what-if Azure login
  pull-requests: write  # sticky summary comment on PRs

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      python: ${{ steps.filter.outputs.python }}
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - 'tests/infra/**'
              - '.github/workflows/build.yml'
              - '.github/workflows/deploy.yml'
            python:
              - 'agents/**'
              - 'functions/**'
              - 'tests/observability/**'
              - 'tests/orchestrator/**'
              - 'tests/knowledge/**'
              - 'tests/__init__.py'
              - 'pyproject.toml'
              - 'requirements-lock.txt'
              - '.python-version'
              - '.github/workflows/build.yml'
            portal:
              - 'portal/**'
              - '.github/workflows/build.yml'
              - '.github/workflows/deploy.yml'

  lint-infra:
    name: Infra · Bicep lint + build
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -sSL https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64 -o bicep
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Run lint test
        run: bash tests/infra/test_bicep_lint.sh

      - name: Bicep build (compile to ARM)
        run: bicep build infra/bicep/main.bicep --outfile /tmp/main.json

      - name: Upload compiled ARM template
        uses: actions/upload-artifact@v4
        with:
          name: arm-template
          path: /tmp/main.json
          retention-days: 14

  what-if-infra:
    name: Infra · what-if (shared RG)
    needs: [ detect, lint-infra ]
    if: needs.detect.outputs.infra == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment group what-if (env=dev)
        run: |
          az deployment group what-if \
            --resource-group rg-condomanager \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/main.parameters.json \
            --parameters env=dev

  lint-python:
    name: Python · ruff + mypy
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Cache pip downloads keyed on the lockfile — re-runs without dep
          # changes finish in ~5s of install time instead of ~60s.
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt
      - name: Install (lockfile + editable package)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e ".[dev]" --no-deps
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy agents

  test-python:
    name: Python · pytest
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt
      - name: Install (lockfile + editable package)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e ".[dev]" --no-deps
      - name: pytest
        run: pytest -q

  build-portal:
    name: Portal · build + test
    needs: detect
    if: needs.detect.outputs.portal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            portal/package-lock.json
            portal/api/package-lock.json
      - name: Frontend — install · lint · test · build
        working-directory: portal
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: API — install · lint · test · build
        working-directory: portal/api
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Upload portal build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: portal/dist
          retention-days: 14

  summary:
    name: PR summary comment
    needs: [ detect, lint-infra, what-if-infra, lint-python, test-python, build-portal ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Compose summary body
        id: body
        uses: actions/github-script@v7
        env:
          INFRA_RAN: ${{ needs.detect.outputs.infra }}
          PYTHON_RAN: ${{ needs.detect.outputs.python }}
          PORTAL_RAN: ${{ needs.detect.outputs.portal }}
          LINT_INFRA_RESULT: ${{ needs.lint-infra.result }}
          WHATIF_INFRA_RESULT: ${{ needs.what-if-infra.result }}
          LINT_PYTHON_RESULT: ${{ needs.lint-python.result }}
          TEST_PYTHON_RESULT: ${{ needs.test-python.result }}
          BUILD_PORTAL_RESULT: ${{ needs.build-portal.result }}
        with:
          script: |
            const cell = (result, ran) => {
              if (!ran) return 'skipped (no relevant changes)';
              if (result === 'success') return 'pass';
              if (result === 'failure') return 'fail';
              if (result === 'cancelled') return 'cancelled';
              return 'skipped';
            };
            const env = process.env;
            const infraRan = env.INFRA_RAN === 'true';
            const pythonRan = env.PYTHON_RAN === 'true';
            const portalRan = env.PORTAL_RAN === 'true';
            const lines = [
              '## CI summary',
              '',
              '| Area | Status |',
              '|------|--------|',
              `| Infra · Bicep lint    | ${cell(env.LINT_INFRA_RESULT, infraRan)} |`,
              `| Infra · what-if       | ${cell(env.WHATIF_INFRA_RESULT, infraRan)} |`,
              `| Python · ruff + mypy  | ${cell(env.LINT_PYTHON_RESULT, pythonRan)} |`,
              `| Python · pytest       | ${cell(env.TEST_PYTHON_RESULT, pythonRan)} |`,
              `| Portal · build + test | ${cell(env.BUILD_PORTAL_RESULT, portalRan)} |`,
            ];
            if (!infraRan && !pythonRan && !portalRan) {
              lines.push('', '_No code paths touched — all area checks skipped._');
            }
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            lines.push('', `_Commit: \`${sha}\` · [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`);
            core.setOutput('body', lines.join('\n'));

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          message: ${{ steps.body.outputs.body }}
