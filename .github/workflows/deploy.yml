# Deploy pipeline — CM-19
#
# Per-env Azure deploys into the shared `rg-condomanager` resource group.
# Single-RG topology: prod resources are distinguished by the `env` parameter
# and the per-env resource name suffix.
#
# Env mapping (dev DISABLED — prod-only while we conserve quota / avoid
# deployment churn; see docs/CICD.md):
#   push to main                  →  deploy-prod  (env=prod, auto — no approval)
#   GitHub Release published      →  deploy-prod  (env=prod, auto — no approval)
#   workflow_dispatch             →  prod only, on demand
#
# The `dev` jobs were removed intentionally. The `prod` GitHub Environment has
# NO required reviewers (see infra/scripts/setup-github-environments.sh), so a
# push to main deploys to prod immediately with no approval prompt. To restore
# an approval gate, add the repo owner back to the prod `reviewers` array in
# that script and re-run it. To re-enable dev, restore the `deploy-dev` /
# `deploy-portal-dev` jobs from git history and add `dev` back to the
# workflow_dispatch options.
#
# OIDC subject scoping uses the existing federated credentials from CM-15:
#   - `repo:.../...:environment:prod` → matched by jobs running in env `prod`
#   - `repo:.../...:ref:refs/heads/main` → covers push-to-main prod deploys
# The approval gate is purely a GitHub Environment protection rule, independent
# of OIDC; removing the reviewer does not change how the job authenticates.
#
# Concurrency: per-ref, do NOT cancel an in-flight deploy. A second push to
# main waits for the first deploy to finish rather than leaving `rg-condomanager`
# in a partial state.
name: deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - 'portal/**'
      - '.github/workflows/deploy.yml'
      # CM-70: the agent runtime image is built inside this workflow (az acr
      # build) from agents/ + requirements-lock.txt (per infra/docker/agent/
      # Dockerfile, itself under infra/**). Without these paths an agent-code-
      # only change merges to main but never rebuilds the image or deploys —
      # the Container App keeps running the previous image.
      - 'agents/**'
      - 'requirements-lock.txt'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Manual deploy target'
        required: true
        type: choice
        options: [ prod ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CM-59: build the agent-runtime image and push it to ACR *before* the bicep
  # deploy, so `deploy-prod` can point the Container App at a freshly-built,
  # immutable tag. Built server-side via `az acr build` (no Docker-in-Actions);
  # the OIDC SP holds AcrPush (CM-20). Runs on EVERY deploy so `agentImage` is
  # always a real tag — otherwise an infra/portal-only change would pass an empty
  # agentImage and revert the Container App to the hello-world placeholder.
  build-agent-image:
    name: Build agent image → ACR
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'release'
      || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az acr build (agent runtime)
        id: build
        run: |
          IMAGE="acrcondomanagerprod.azurecr.io/agent:${{ github.sha }}"
          az acr build \
            --registry acrcondomanagerprod \
            --image "agent:${{ github.sha }}" \
            --image "agent:latest" \
            --file infra/docker/agent/Dockerfile \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Write step summary
        run: |
          {
            echo "### Agent image build — success"
            echo ""
            echo "* Registry: \`acrcondomanagerprod\`"
            echo "* Image: \`acrcondomanagerprod.azurecr.io/agent:${{ github.sha }}\` (+ \`:latest\`)"
            echo "* Dockerfile: \`infra/docker/agent/Dockerfile\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy → prod
    needs: build-agent-image
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'release'
      || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment group create (env=prod)
        run: |
          az deployment group create \
            --resource-group rg-condomanager \
            --name cm-rg-prod-${{ github.run_number }} \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/main.parameters.json \
            --parameters env=prod \
            --parameters agentImage='${{ needs.build-agent-image.outputs.image }}'

      - name: Write step summary
        run: |
          {
            echo "### Deploy to prod — success"
            echo ""
            echo "* Resource group: \`rg-condomanager\`"
            echo "* Deployment name: \`cm-rg-prod-${{ github.run_number }}\`"
            echo "* Agent image: \`${{ needs.build-agent-image.outputs.image }}\`"
            echo "* Triggered by: \`${{ github.event_name }}\` (\`${{ github.ref }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-portal-prod:
    name: Deploy portal → prod (SWA)
    # CM-37: gated on a repo variable so `main` stays green until the operator
    # provisions the Static Web App and sets PORTAL_DEPLOY_ENABLED=true.
    # The SWA deployment token is fetched JUST-IN-TIME via OIDC az login
    # (`az staticwebapp secrets list`) — no long-lived token secret is stored
    # in the repo, keeping the CM-15 OIDC-only posture.
    if: >-
      vars.PORTAL_DEPLOY_ENABLED == 'true'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'release'
        || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod')
      )
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token (via OIDC, not a stored secret)
        id: swatoken
        run: |
          token=$(az staticwebapp secrets list \
            --name swa-condomanager-prod \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          # CM-60: baked into the vite build so the prod chat page calls the
          # Container App API cross-origin (CORS allows the SWA origin). Empty in
          # local dev keeps /web/* same-origin via the vite proxy.
          VITE_WEBCHAT_API_BASE: https://ca-hello-condomanager-prod.ambitiousbay-0a96856a.eastus2.azurecontainerapps.io
        with:
          azure_static_web_apps_api_token: ${{ steps.swatoken.outputs.token }}
          action: upload
          app_location: portal
          api_location: portal/api
          output_location: dist

      - name: Write step summary
        run: |
          {
            echo "### Deploy portal → prod — success"
            echo ""
            echo "* Static Web App: \`swa-condomanager-prod\`"
            echo "* App location: \`portal\` · API: \`portal/api\` · output: \`dist\`"
            echo "* Triggered by: \`${{ github.event_name }}\` (\`${{ github.ref }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
